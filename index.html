<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0d0d0d">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* VOICE everyday wayfinding, a visitor on their phone in a crowded foyer
   IDEA the printed FARM mässkarta, brought to life: same dark sheet, cream booths, coral rooms
   PICTURE the floor plan itself, large, tappable, pinch-zoomable, one floor at a time
   COLOUR fixed FARM palette: near-black ground, cream booths, coral #dd654b, grey walls
   TYPE Crimson Pro (the poster's serif) for titles and room names, Inter for labels
   LAYOUT laptop: map left with info card, exhibitor list right. phone: title, floor tabs, map, card, search, list */
:root{color-scheme:dark;--bg:#0d0d0d;--panel:#161616;--line:#2a2a28;--wall:#babab4;--ink:#f4f4f1;--mute:#a3a39c;--coral:#dd654b;--coral2:#f07a60;--booth:#f4f4f1;--done:#5d5d58}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
a{color:var(--coral2)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,4vw,env(safe-area-inset-left,0px));padding-right:max(16px,4vw,env(safe-area-inset-right,0px))}
header{padding-top:clamp(18px,3vw,36px);padding-bottom:14px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
.brand{display:flex;align-items:center;flex-wrap:wrap;gap:14px 24px}
.ttl{border-left:1px solid #3a3a37;padding-left:24px}
.logo{display:block;height:clamp(48px,6.5vw,64px);width:auto;max-width:100%}
.logolink{flex:none;border-radius:4px}
.logolink:focus-visible{outline:2px solid var(--coral2);outline-offset:4px}
h1{font:700 clamp(30px,5vw,46px)/1.05 "Crimson Pro",Georgia,serif;letter-spacing:-.01em;margin:0}
.kicker{color:var(--coral);font-weight:700;font-size:14px;margin:0 0 2px}
.meta{color:var(--mute);font-size:15px;margin:0;text-align:right}
.meta b{color:var(--ink);font-weight:500}
main{display:grid;gap:20px 28px;padding-bottom:40px}
@media(min-width:900px){main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);align-items:start}.mapcol{position:sticky;top:12px}}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;min-height:46px;border:1px solid var(--line);background:var(--panel);color:var(--mute);border-radius:10px;font:600 16px Inter,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.tab span{font-weight:400;font-size:14px}
.tab[aria-selected=true]{background:var(--coral);border-color:var(--coral);color:#fff}
.tab[aria-selected=true] span{color:#fff;opacity:.85}
.tab:focus-visible,.row:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--coral2);outline-offset:2px}
.fig{position:relative;background:#101010;border:1px solid var(--line);border-radius:14px;height:clamp(260px,62vw,560px);overflow:hidden}
@media(min-width:900px){.fig{height:min(60vh,560px)}}
.fig svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.fig svg.drag{cursor:grabbing}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:rgba(22,22,22,.92);color:var(--ink);font:500 22px/1 Inter,sans-serif;cursor:pointer}
.zoom button:hover{border-color:var(--wall)}
.hint{position:absolute;left:12px;bottom:10px;transition:opacity .3s;font-size:13px;color:var(--mute);pointer-events:none}
.floorlbl{position:absolute;left:14px;top:10px;font:700 15px Inter,sans-serif;color:var(--coral);pointer-events:none}
.floorlbl b{display:block;font:600 40px/1 "Crimson Pro",Georgia,serif;color:var(--ink)}
.booth rect{fill:var(--booth);stroke:#0d0d0d;stroke-width:.5;transition:fill .2s}
.booth text{fill:var(--coral);font:700 8.5px Inter,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.booth{cursor:pointer;outline:none}
.booth:hover rect,.booth:focus-visible rect{fill:#ffe3d9}
.booth.done rect{fill:var(--done)}
.booth.done text{fill:#d9d9d3}
.booth.sel rect{fill:var(--coral)}
.booth.sel text{fill:#fff}
.ring{fill:none;stroke:var(--coral2);stroke-width:1.6;opacity:0}
.booth.sel .ring{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{opacity:.9;stroke-width:1.6}100%{opacity:0;stroke-width:9}}
@media(prefers-reduced-motion:reduce){.booth.sel .ring{animation:none;opacity:.8}}
.room{cursor:pointer}
.room .bg{fill:var(--coral);transition:fill .2s}
.room:hover .bg,.room.sel .bg{fill:var(--coral2)}
.room text{fill:#fff;font:700 10.5px "Crimson Pro",Georgia,serif;text-anchor:middle;pointer-events:none}
.stairs{cursor:pointer}
.stairs .pill{fill:var(--coral)}
.stairs text{fill:#fff;font:700 4.6px Inter,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.wall{fill:none;stroke:var(--wall);stroke-width:1.1}
.card{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;min-height:86px}
.card .num{font:700 34px/1 "Crimson Pro",Georgia,serif;color:var(--coral);min-width:1.4em;text-align:center}
.card h2{margin:0;font:700 22px/1.15 "Crimson Pro",Georgia,serif}
.card p{margin:2px 0 0;color:var(--mute);font-size:14px}
.card.empty{grid-template-columns:1fr}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--wall);background:transparent;color:var(--ink);font:600 15px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.link{border-color:var(--coral);color:var(--coral2)}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;height:48px;border-radius:10px;border:1px solid #3a3a37;background:var(--panel);color:var(--ink);font:16px Inter,sans-serif;padding:0 14px 0 42px}
.search input::placeholder{color:#85857f}
.search svg{position:absolute;left:14px;top:15px;width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2}
.prog{display:flex;align-items:center;gap:12px;margin:0 0 10px;font-size:14px;color:var(--mute)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--coral);width:0;transition:width .3s}
.prog button{background:none;border:0;color:var(--mute);font:500 14px Inter,sans-serif;text-decoration:underline;cursor:pointer;padding:10px 0;min-height:44px}
h3{font:700 14px Inter,sans-serif;color:var(--coral);margin:18px 0 6px}
h3:first-of-type{margin-top:6px}
ul{list-style:none;margin:0;padding:0}
.row{width:100%;display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;align-items:center;gap:10px;min-height:46px;padding:4px 10px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:600 17px/1.25 Inter,sans-serif;text-align:left;cursor:pointer;border-radius:8px}
.row:hover{background:#1b1b1b}
.row .n{color:var(--coral);font-weight:700;text-align:right}
.row.sel{background:#2a1813}
.row.done .nm{color:var(--mute);text-decoration:line-through;text-decoration-color:#6a6a64}
.row .ck{font-size:14px;color:var(--mute);font-weight:500}
.none{color:var(--mute);padding:14px 10px;font-size:15px}
footer{border-top:1px solid var(--line);padding-top:16px;padding-bottom:28px;color:var(--mute);font-size:14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chip{font:500 14px/1.2 Inter,sans-serif;padding:6px 11px;border-radius:999px;background:#2a1813;color:#ffd3c7;border:1px solid #5a2c22;white-space:nowrap}
.filters{display:flex;gap:6px;overflow-x:auto;margin:0 0 6px;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #3a3a37;background:var(--panel);color:#cfcfc9;font:500 14px Inter,sans-serif;cursor:pointer}
.fbtn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fbtn:focus-visible{outline:2px solid var(--coral2);outline-offset:2px}
.row .nm small{display:block;font:400 13px/1.35 Inter,sans-serif;color:var(--mute);margin-top:2px;text-decoration:none}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.info{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end}
.info[hidden]{display:none}
.sheet{background:var(--bg);width:100%;height:100%;overflow-y:auto;overscroll-behavior:contain;padding:0 max(18px,env(safe-area-inset-right,0px)) 48px max(18px,env(safe-area-inset-left,0px));animation:slide .25s ease-out}
@media(min-width:900px){.info{pointer-events:none}.sheet{pointer-events:auto;width:min(520px,42vw);border-left:1px solid var(--line);box-shadow:-24px 0 48px rgba(0,0,0,.55);padding-inline:28px}}
@keyframes slide{from{transform:translateX(28px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.ihead{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);z-index:1}
.ititle{display:flex;gap:16px;align-items:flex-start;margin:24px 0 18px}
.ititle .num{font:700 52px/.9 "Crimson Pro",Georgia,serif;color:var(--coral);flex:none}
.ititle h2{font:700 clamp(30px,6vw,40px)/1.05 "Crimson Pro",Georgia,serif;margin:0;letter-spacing:-.01em}
.ititle p{margin:6px 0 0;color:var(--mute);font-size:15px}
.plate{background:#fff;border-radius:12px;padding:18px 22px;display:flex;align-items:center;justify-content:center;height:112px;margin:0 0 6px}
.plate img{max-height:100%;max-width:100%;object-fit:contain;display:block}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px 18px;margin:20px 0 4px;padding:16px 0;border-block:1px solid var(--line);font-size:15.5px}
.facts dt{color:var(--mute)}
.facts dd{margin:0;overflow-wrap:anywhere}
.about p{font-size:16.5px;line-height:1.62;margin:0 0 14px;max-width:62ch;color:#e9e9e4}
.sheet h4{font:700 14px Inter,sans-serif;color:var(--coral);margin:24px 0 10px}
.src{font-size:13px;color:#85857f;margin-top:28px}
.rp{border-bottom:1px solid var(--line)}
.rp summary,.rp .nm{cursor:pointer;font:600 17px/1.3 Inter,sans-serif;list-style:none;display:flex;justify-content:space-between;gap:12px;padding:13px 0}
.rp summary::-webkit-details-marker{display:none}
.rp summary::after{content:"+";color:var(--coral);font-weight:500;font-size:20px;line-height:1}
.rp[open] summary::after{content:"−"}
.rp .nm{cursor:default}
.rp p{margin:0 0 14px;color:#d6d6d0;font-size:15.5px;line-height:1.58}
.rp p.rsrc{font-size:13px;color:#85857f;font-style:italic;margin-top:-4px}
.now{font:600 12px Inter,sans-serif;background:var(--coral);color:#fff;border-radius:999px;padding:3px 9px;margin-left:8px;vertical-align:2px}
.empty-note{color:var(--mute);font-size:16px;line-height:1.55}
@media(max-width:899px){body.lock{overflow:hidden}}
@media(max-width:600px){.ttl{border-left:0;padding-left:0}.brand{flex-direction:column;align-items:flex-start}.meta{text-align:left}header{align-items:flex-start}.card{grid-template-columns:auto minmax(0,1fr)}.card .acts{grid-column:1/-1;display:flex;gap:8px}.card .acts .btn{flex:1}}
</style>
</head>

ng girls' self-confidence, curiosity and opportunities. We drive a more equal and inclusive technology industry to contribute to skills supply, positive development for Swedish companies and for future technological innovations."], "offers": ["Mentorprogram"], "years": ["Kandidat", "Master"], "sector": "Diverse tech industry", "size": "1 500+", "url": "https://pepp.io/", "web": "pepp.io", "email": "goteborg@blipepp.nu", "contactName": "", "contactNote": "", "sizeLabel": "Engagerade"}, "15": {"full": "IAESTE", "about": ["International Association for the Exchange of Students for Technical Experience (IAESTE) is a global non-governmental, non-profit organisation in consultative status with the United Nations Economic and Social Council (ECOSOC), affiliated with the UN DPI, and in consultative status with UNESCO. Paid internships abroad help students gain professional experience and cross-cultural skills. Employers and universities gain access to talented international interns who bring new impulses and insights to their business or research. IAESTE provides primarily STEM internships"], "offers": ["Sommarjobb", "Praktik"], "years": ["Master"], "sector": "Computer Science, Civil Engineering, Mechanical Engineering", "size": "", "url": "", "web": "", "email": "", "contactName": "", "contactNote": "", "sizeLabel": "Anställda"}, "16": {"full": "Ingenjörer utan gränser", "about": ["Ingenjörer utan gränser är en volontärdriven organisation som sedan 2007 samlar ingenjörer och mobiliserar teknisk kompetens för hållbar samhällsutveckling. Tillsammans med lokala partners kombinerar vi ingenjörskunskap med lokal erfarenhet för att utveckla lösningar som möter verkliga behov och skapar långsiktig förändring. Genom projekt i Sverige och internationellt engagerar vi ingenjörer, inspirerar unga och visar hur ingenjörskonst kan bidra till en mer hållbar och jämlik värld. Besök vår monter för att ta reda på hur du kan engagera dig som volontör eller helt enkelt för att lära dig mer om vårt arbete."], "offers": ["Exjobb", "Volontärroller"], "years": ["Kandidat", "Master", "Doktorand"], "sector": "Humanitarian engineering", "size": "200", "url": "https://www.ewb-swe.org/get-involved", "web": "www.ewb-swe.org/get-involved", "email": "hr.chalmers@ewb-swe.org", "contactName": "", "contactNote": "", "sizeLabel": "Volontärer"}, "17": {"full": "CAESAR", "about": ["CAESAR is a society for students at Chalmers with a burning interest in space and space technology, with a drive to get practical experience in the area. We design and develop rockets in order to take Chalmers closer to the dream: A rocket that surpasses the Kármán line."], "offers": ["Praktiskt raketbygge"], "years": ["Kandidat", "Master"], "sector": "Aerospace", "size": "20", "url": "https://caesar.se/", "web": "caesar.se", "email": "info@caesar.se", "contactName": "", "contactNote": "", "sizeLabel": "Medlemmar"}}, "rc": [{"name": "Ida Ekmark", "slots": [1], "about": "Jag forskar inom plasmafysik med fokus på fusion. Mer specifikt studerar jag strömmar av relativistiska elektroner som kan genereras i fusionsreaktorer under särskilda förhållanden. Sådana strömmar kan bära på stora mängder energi och riskerar att skada maskinen. Min forskning handlar om att studera dessa elektroner, och hur de kan undvikas eller mitigeras."}, {"name": "Tom Blackburn", "slots": [1], "about": "The world's most powerful lasers, the acceleration of electrons and ions, the creation of matter and antimatter, and breakdown of the vacuum itself: all of these and more are topics of interest in the plasma physics group at GU. We use theory and simulations to investigate the dynamics of the plasmas that are found in the most extreme environments in the universe. Stop by to find out more about plasma physics, research in general, as well as what it's like to be a doctoral student."}, {"name": "Giovanna Tancredi", "slots": [1], "about": "Giovanna Tancredi forskar på supraledande kvantdatorer och har varit med och byggt Sveriges 100-kvantbitsprocessor inom WACQT, där hon i dag är vice föreståndare. Hon har även grundat startupföretaget SCALINQ."}, {"name": "Julie Gold", "slots": [1], "about": "Julie Gold är professor i biomaterial och viceprefekt med ansvar för forskarutbildning på Fysikinstitutionen. Hon finns på plats för att svara på frågor om hur det är att doktorera. Hennes egen forskning handlar om implantat, vävnadsodling och odlat kött."}, {"name": "Andreas Heinz", "slots": [1, 3], "about": "Andreas Heinz forskar i experimentell subatomär fysik vid Fysikinstitutionen på Chalmers. Hans fokus är kärnklyvning, fission, hos kortlivade och ovanliga atomkärnor, som är betydligt svårare att studera än långlivade isotoper som uran. Experimenten görs i internationella samarbeten, bland annat med R3B-uppställningen vid GSI/FAIR i Tyskland och vid ISOLDE på CERN.\n\nEtt mål med forskningen är att förstå hur tunga grundämnen bildas när neutronstjärnor kolliderar, där fission tros spela en nyckelroll. Han har bland annat varit med i en stor internationell studie som visade att skaleffekter i atomkärnan påverkar hur den klyvs.", "src": "Sammanfattning skriven av FARM utifrån Chalmers webbplats."}, {"name": "Andreas Rosén", "slots": [2], "about": "Det centrala i min forskning är singulära integralekvationer för att lösa randvärdesproblem för elliptiska partiella differentialekvationer i områden med icke-slät rand eller med icke-släta koefficienter. Tekniker från harmonisk analys, som använder baser av wavelet-typ snarare än Fourierbaser, och tekniker från operatorteori, med funktionalkalkyl av icke-självadjungerade operatorer, används för att studera integralekvationerna ifråga.\n\nEn viktig tillämpning är elektromagnetiska spridningsproblem för Maxwells ekvationer, för vilka mycket effektiva integralekvationer har utvecklats av mig med inspiration från geometrisk multivektoranalys, en sorts hyperkomplex analys som använder Dirac-ekvationer och Clifford-algebra. I samarbete med ledande beräkningsmatematiker har jag utvecklat algoritmer som löser EM-spridningsproblem till maskinprecision. Jag är medgrundare till Elefantfisk AB, ett nystartat företag som har patent på dessa algoritmer."}, {"name": "Mattias Thuvander", "slots": [2], "about": "Mattias Thuvander är professor i mikrostrukturfysik och studierektor för forskarskolan i materialvetenskap. Han finns på plats för att svara på frågor om forskarutbildningen. Själv undersöker han material för kärnkraft på atomnivå med atomsondstomografi."}, {"name": "Shan Zhang", "slots": [2], "about": "With the fast development of different emerging technologies, it is important to consider their impacts on the environment and resources in the future to prevent unwanted environmental consequences. Here, I'll discuss how we explore these future impacts at the technologies' early development stage."}, {"name": "Jan Swenson", "slots": [3], "about": "As one of the study directors of the graduate school in physics, I can give general information about the research at the department and how it is to be a PhD student. I can also tell about my own research on the role of water for proteins, how proteins can be stabilized by sugar, and how electrolytes can be optimized for structural batteries."}, {"name": "ENV-institutionen, Chalmers", "slots": [1, 2, 3], "about": "At the ENV department at Chalmers, we explore how our planet is changing and develop the knowledge and solutions society needs for a sustainable future. Our five divisions cover the atmosphere and climate (Geoscience and Remote Sensing), energy and industrial processes (Energy Technology), sustainable shipping and road transport (Maritime Environmental Science), and the links between technology, society and nature (Physical Resource Theory and Environmental Systems Analysis).\n\nCome talk to researchers who study how contrails behind airplanes heat up our planet, heavy rain and flooding in Scandinavia, the environmental footprint of new battery technologies, and how carbon dioxide removal fits into future energy systems. Are you interested in becoming a PhD student in Environmental and Energy Sciences? Meet us in the Research Corner!"}]};

 if(o.n){const d=done.has(o.n);
  const co=DATA.co[o.n];
  c.innerHTML=`<div class="num">${o.n}</div><div><h2>${o.name}</h2><p>${co&&co.offers.length?co.offers.join(' · '):'Plan '+o.f}</p></div>
  <div class="acts"><button class="btn link" id="more">Läs mer</button><button class="btn ${d?'on':''}" id="mark" aria-pressed="${d}">${d?'✓ Besökt':'Markera besökt'}</button></div>`;
  document.getElementById('mark').onclick=()=>toggleDone(o.n);
  document.getElementById('more').onclick=()=>openInfo(o.id);
 }else if(o.id==='forskarhornan'){c.innerHTML=`<div class="num" style="font-size:22px">●</div><div><h2>${o.name}</h2><p>${DATA.rc.length} forskare och institutioner under dagen</p></div><div class="acts"><button class="btn link" id="more">Läs mer</button></div>`;
  document.getElementById('more').onclick=()=>openInfo(o.id);
 }else{c.innerHTML=`<div class="num" style="font-size:22px">●</div><div><h2>${o.name}</h2><p>${o.note}</p></div><div></div>`}
}
function paintDone(){
 for(const b of EX)document.getElementById('b-'+b.n).classList.toggle('done',done.has(b.n));
 const k=done.size;document.getElementById('ptxt').textContent=`${k} av ${EX.length} besökta`;
 document.getElementById('pbar').style.width=(k/EX.length*100)+'%';document.getElementById('clr').hidden=!k;
}
const LOGOS={11:'logos/11.png'};
const FIL=[['alla','Alla'],['Sommarjobb','Sommarjobb'],['Exjobb','Exjobb'],['Heltid','Heltid'],['pt','Praktik och trainee'],['dr','Doktorand'],['eng','Engagera dig']];
const ENG=['Studentförening','Studentprojekt','Volontärroller','Mentorprogram','Praktiskt raketbygge'];
let fil='alla';
const fit=b=>{const co=DATA.co[b.n];if(fil==='alla')return true;if(!co)return false;const of=co.offers;
 if(fil==='pt')return of.includes('Praktik')||of.includes('Trainee');if(fil==='eng')return of.some(x=>ENG.includes(x));
 if(fil==='dr')return of.includes('Doktorandtjänst');return of.includes(fil)};
function renderFilters(){document.getElementById('filters').innerHTML=FIL.map(([k,l])=>`<button class="fbtn" data-k="${k}" aria-pressed="${fil===k}">${l}</button>`).join('')}
const hay=b=>{const co=DATA.co[b.n]||{};return [b.name,co.full,co.sector,(co.offers||[]).join(' '),(co.about||[]).join(' ')].join(' ').toLowerCase()};
function renderList(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 const hit=b=>fit(b)&&(!q||String(b.n)===q||hay(b).includes(q));
 const grp=f=>{const items=EX.filter(b=>b.f===f&&hit(b));if(!items.length)return'';
  return `<h3>Plan ${f}</h3><ul>${items.map(b=>`<li><button class="row ${sel===b.id?'sel':''} ${done.has(b.n)?'done':''}" data-id="${b.id}">
  <span class="n">${b.n}</span><span class="nm">${b.name}<small>${DATA.co[b.n]&&DATA.co[b.n].offers.length?DATA.co[b.n].offers.join(' · '):'Ingen info inlämnad'}</small></span><span class="ck">${done.has(b.n)?'✓':''}</span></button></li>`).join('')}</ul>`};
 const html=grp(2)+grp(3);
 document.getElementById('list').innerHTML=html||`<p class="none">${q?`Inget företag matchar ”${esc(q)}”`:'Ingen utställare'}${fil!=='alla'?' med det filtret':''}.</p>`;
}

const esc=t=>String(t).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function toggleDone(n){done.has(n)?done.delete(n):done.add(n);save();paintDone();renderCard();renderList();
 const im=document.getElementById('imark');if(im){const d=done.has(n);im.className='btn'+(d?' on':'');im.textContent=d?'✓ Besökt':'Markera besökt';im.setAttribute('aria-pressed',d)}}
const SLOTS={1:'Kl. 10–12',2:'Kl. 12–14',3:'Kl. 14–16'};
function nowSlot(){try{const p=Object.fromEntries(new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Stockholm',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
 if(`${p.year}-${p.month}-${p.day}`!=='2026-11-25')return 0;const h=+p.hour;return h>=10&&h<12?1:h>=12&&h<14?2:h>=14&&h<16?3:0}catch(e){return 0}}
let lastFocus=null;
function openInfo(id){
 const o=byId(id);if(!o)return;const sh=document.getElementById('sheet');let body='';
 if(o.n){const co=DATA.co[o.n];const d=done.has(o.n);
  body=`<div class="ihead"><button class="btn" id="iback">← Kartan</button><button class="btn ${d?'on':''}" id="imark" aria-pressed="${d}">${d?'✓ Besökt':'Markera besökt'}</button></div>
  <div class="ititle"><div class="num">${o.n}</div><div><h2 id="ih">${esc(o.name)}</h2><p>${co&&co.full!==o.name?esc(co.full)+' · ':''}Plan ${o.f}, monter ${o.n}</p></div></div>`;
  if(co){const facts=[['Söker',co.years.join(', ')],['Område',esc(co.sector)],[co.sizeLabel,esc(co.size)],
    ['Webb',co.url?`<a href="${esc(co.url)}" target="_blank" rel="noopener">${esc(co.web)}</a>`:''],
    ['Kontakt',co.email?`${co.contactName?esc(co.contactName)+'<br>':''}<a href="mailto:${esc(co.email)}">${esc(co.email)}</a>`:esc(co.contactNote)]].filter(f=>f[1]);
   body+=`${LOGOS[o.n]?`<div class="plate"><img src="${LOGOS[o.n]}" alt="${esc(o.name)}s logotyp"></div>`:''}${co.offers.length?`<h4>Erbjuder</h4><ul class="chips">${co.offers.map(x=>`<li class="chip">${esc(x)}</li>`).join('')}</ul>`:''}
   <dl class="facts">${facts.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
   <h4>Om ${esc(o.name)}</h4><div class="about">${co.about.map(x=>`<p>${esc(x)}</p>`).join('')}</div>
   <p class="src">Texten kommer från utställarens anmälan till FARM-mässan.</p>`}
  else body+=`<p class="empty-note">${esc(o.name)} har inte skickat in någon presentation än. Gå förbi monter ${o.n} på plan ${o.f} och fråga dem direkt.</p>`;
 }else if(id==='forskarhornan'){const ns=nowSlot();
  body=`<div class="ihead"><button class="btn" id="iback">← Kartan</button><span></span></div>
  <div class="ititle"><div><h2 id="ih">Forskarhörnan</h2><p>Plan 2, bredvid trappan till plan 3</p></div></div>
  <p class="about" style="margin:0"><span style="font-size:16.5px;line-height:1.6;color:#e9e9e4">Forskare finns på plats i olika pass under dagen. Fråga om deras forskning, eller om hur det är att doktorera.</span></p>
  ${[1,2,3].map(sl=>`<h4>${SLOTS[sl]}${ns===sl?'<span class="now">Pågår nu</span>':''}</h4>${DATA.rc.filter(r=>r.slots.includes(sl)).map(r=>r.about?
   `<details class="rp"><summary>${esc(r.name)}</summary>${r.about.split('\n\n').map(x=>`<p>${esc(x)}</p>`).join('')}${r.src?`<p class="rsrc">${esc(r.src)}</p>`:''}</details>`:`<div class="rp"><div class="nm">${esc(r.name)}</div></div>`).join('')}`).join('')}
  <p class="src">Texterna kommer från forskarnas anmälan, om inget annat anges.</p>`;
 }else return;
 sh.innerHTML=body;sh.scrollTop=0;lastFocus=document.activeElement;
 const box=document.getElementById('info');box.hidden=false;document.body.classList.add('lock');
 document.getElementById('iback').onclick=closeInfo;const im=document.getElementById('imark');if(im)im.onclick=()=>toggleDone(o.n);
 document.getElementById('iback').focus({preventScroll:true});
}
function closeInfo(){document.getElementById('info').hidden=true;document.body.classList.remove('lock');if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('info').hidden)closeInfo()});

// interaction on the map
const pts=new Map();let moved=false,downEl=null,startPt=null;
svg.addEventListener('pointerdown',e=>{cancelAnimationFrame(anim);svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pts.size===1){moved=false;startPt={x:e.clientX,y:e.clientY};downEl=e.target.closest('[data-id],[data-go]')}else moved=true;svg.classList.add('drag');document.getElementById('hint').style.opacity=0});
svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);const cur={x:e.clientX,y:e.clientY};
 const scale=svg.getScreenCTM().a;
 if(pts.size===1){if(Math.hypot(cur.x-startPt.x,cur.y-startPt.y)>6)moved=true;
  if(moved){vb.x-=(cur.x-prev.x)/scale;vb.y-=(cur.y-prev.y)/scale;clampVB();setVB()}}
 else if(pts.size===2){const [a,b]=[...pts.entries()].map(([id,p])=>id===e.pointerId?cur:p);const [pa,pb]=[...pts.entries()].map(([id,p])=>p);
  const d0=Math.hypot(pa.x-pb.x,pa.y-pb.y),d1=Math.hypot(a.x-b.x,a.y-b.y);
  if(d0>0&&d1>0){const m=toSvg((a.x+b.x)/2,(a.y+b.y)/2);zoomAt(m,d0/d1)}}
 pts.set(e.pointerId,cur)});
const up=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
 if(!pts.size){svg.classList.remove('drag');if(!moved&&downEl&&e.type==='pointerup')activate(downEl);downEl=null}};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(anim);zoomAt(toSvg(e.clientX,e.clientY),Math.exp(e.deltaY*0.0015))},{passive:false});
svg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const t=e.target.closest('[data-id],[data-go]');if(t){e.preventDefault();activate(t)}}});
function activate(el){if(el.dataset.go){const g=+el.dataset.go;if(g)setFloor(g);else{const h=document.getElementById('hint');h.textContent='Härifrån kommer man upp från plan 1';h.style.opacity=1}return}select(el.dataset.id)}

const centre=()=>({x:vb.x+vb.w/2,y:vb.y+vb.h/2});
document.getElementById('zin').onclick=()=>zoomAt(centre(),1/1.5);
document.getElementById('zout').onclick=()=>zoomAt(centre(),1.5);
document.getElementById('zreset').onclick=()=>animateTo({...BASE[floor]});
for(const t of document.querySelectorAll('.tab'))t.onclick=()=>setFloor(+t.dataset.f);
document.getElementById('list').addEventListener('click',e=>{const r=e.target.closest('.row');if(r)select(r.dataset.id,{scroll:true})});
document.getElementById('q').addEventListener('input',renderList);
document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('.fbtn');if(!b)return;fil=b.dataset.k;renderFilters();renderList()});
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){const r=document.querySelector('.row');if(r)select(r.dataset.id,{scroll:true})}});
document.getElementById('clr').onclick=()=>{done.clear();save();paintDone();renderCard();renderList()};

const fromHash=()=>{const h=location.hash.slice(1);if(byId(h)){select(h);if(h.startsWith('monter-')||h==='forskarhornan')openInfo(h)}else if(h==='plan-3')setFloor(3);else if(h==='plan-2')setFloor(2)};
window.addEventListener('hashchange',fromHash);
setFloor(2);paintDone();renderFilters();renderCard();renderList();fromHash();
}
</script>
</body>
</html>
